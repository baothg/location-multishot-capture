name: location_multishot_capture
description: >-
  Flutter plugin that opens a native Android Camera2 multi-shot capture
  session with optional per-photo location validation.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.11.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.thgbao.location_multishot_capture
        pluginClass: LocationMultishotCapturePlugin
